<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lumina - Light Puzzle Game</title>
  <link rel="stylesheet" href="css/core/tokens.css">
  <link rel="stylesheet" href="css/core/base.css">
  <link rel="stylesheet" href="css/gameplay/canvas.css">
  <link rel="stylesheet" href="css/gameplay/hud.css">
  <link rel="stylesheet" href="css/editor/editor.css">
  <link rel="stylesheet" href="css/editor/modal.css" onerror="this.onerror=null;this.href='css/editor/code-modal.css'">
  <link rel="stylesheet" href="css/modals/dialogs.css">
  <link rel="stylesheet" href="css/modals/level-select.css">
</head>
<body>
  <div id="app-root" class="app-root">
    <!-- Main Menu Screen (Isolated) -->
    <section id="screen-menu" class="view-screen">
      <div class="menu-card">
        <h1 class="brand-title">LUMINA</h1>
        <p class="brand-desc">Guide and bend beams of light using precision mirrors, prisms, lenses, and gravity to energize every target.</p>
        <div class="menu-actions">
          <button id="btn-menu-play" class="hud-btn hud-btn-primary">Play Levels</button>
          <button id="btn-menu-editor" class="hud-btn">Level Editor</button>
          <button id="btn-menu-levels" class="hud-btn">Levels</button>
          <button id="btn-menu-clear" class="hud-btn btn-danger" type="button">Clear Memory</button>
        </div>
      </div>
    </section>

    <!-- Gameplay Screen -->
    <main id="screen-gameplay" class="view-screen hidden">
      <div id="canvas-container" class="canvas-container">
        <canvas id="viewport-canvas"></canvas>
        <div id="gizmo-rotation" class="gizmo-rotation hidden">
          <div id="gizmo-coords" class="gizmo-coord-badge">X: 500 Y: 350</div>
          <div class="gizmo-ring"></div>
          <div class="gizmo-handle"></div>
          <div class="gizmo-angle-control">
            <button id="btn-angle-sub" class="btn-step" type="button">-5°</button>
            <input type="number" id="gizmo-angle-input" class="gizmo-angle-input" min="0" max="359" value="0">
            <span class="gizmo-unit">°</span>
            <button id="btn-angle-add" class="btn-step" type="button">+5°</button>
            <button id="btn-gizmo-remove" class="btn-step btn-remove" type="button" title="Remove piece (Delete)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </div>
      </div>

      <header id="game-header" class="game-header">
        <div class="header-left">
          <button id="btn-hdr-exit-preview" class="hud-btn btn-danger hidden" type="button">Exit Preview</button>
          <button id="btn-hdr-menu" class="hud-btn">Menu</button>
          <div class="header-level-info"><span id="hdr-level-title" class="title">Level 1</span></div>
        </div>
        <div class="header-center">
          <button id="btn-run-check" class="hud-btn hud-btn-primary btn-run" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Run Test</span>
          </button>
          <div id="sensor-progress" class="sensor-progress">
            <span class="label">Targets:</span>
            <div id="sensor-indicators" class="sensor-indicators"></div>
          </div>
        </div>
        <div class="header-right">
          <div id="pointer-coord-display" class="pointer-coord-badge">X: --- Y: ---</div>
          <button id="btn-hdr-reset" class="hud-btn">Reset</button>
          <button id="btn-hdr-levels" class="hud-btn">Levels</button>
          <button id="btn-hdr-audio" class="hud-btn">Sound: On</button>
        </div>
      </header>

      <footer id="game-toolbar" class="game-toolbar">
        <div class="toolbar-wrapper">
          <span class="toolbar-title">PIECES</span>
          <div id="inventory-tray" class="inventory-tray"></div>
        </div>
      </footer>
    </main>

    <!-- Level Editor Screen -->
    <section id="screen-editor" class="view-screen hidden">
      <div class="editor-shell">
        <header class="editor-header">
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="btn-editor-exit" class="hud-btn">Exit</button>
            <div class="editor-name-bar">
              <span class="editor-name-tag">NAME:</span>
              <input type="text" id="editor-level-name-input" class="editor-name-input" value="Custom Level">
            </div>
            <button id="btn-editor-open" class="hud-btn">Load Level</button>
            <button id="btn-editor-code" class="hud-btn">Level Code</button>
            <button id="btn-editor-save" class="hud-btn">Save Level</button>
          </div>
          <button id="btn-editor-test" class="hud-btn hud-btn-primary">Preview Level</button>
        </header>
        <div class="editor-workspace">
          <aside class="editor-tools-sidebar">
            <span style="font-size: 11px; font-weight: 800; color: var(--color-moon-mist); padding: 4px;">PLACEMENT</span>
            <button class="editor-tool-btn active" data-tool="select">Select / Move</button>
            <button class="editor-tool-btn" data-tool="emitter">Add Emitter</button>
            <button class="editor-tool-btn" data-tool="sensor">Add Sensor</button>
            <button class="editor-tool-btn" data-tool="wall">Add Wall</button>
            <button class="editor-tool-btn" data-tool="mirror">Add Mirror</button>
            <button class="editor-tool-btn" data-tool="prism">Add Prism</button>
            <button class="editor-tool-btn" data-tool="lens_convex">Add Convex Lens</button>
            <button class="editor-tool-btn" data-tool="lens_concave">Add Concave Lens</button>
            <button class="editor-tool-btn" data-tool="beam_splitter">Add Splitter</button>
            <button class="editor-tool-btn" data-tool="portal">Add Portal</button>
            <button class="editor-tool-btn" data-tool="black_hole">Add Black Hole</button>
          </aside>
          <div style="position: relative; overflow: hidden;"></div>
          <aside class="editor-inspector">
            <div class="inspector-section">
              <div class="inspector-title">MAP SETTINGS</div>
              <div class="prop-field"><label>Level Title</label><input type="text" id="prop-level-title" class="prop-input" style="width: 130px;" value="Custom Level"></div>
              <div class="prop-field"><label>Width (Px)</label><input type="number" id="prop-map-width" class="prop-input" value="1000" min="600" max="1800"></div>
              <div class="prop-field"><label>Height (Px)</label><input type="number" id="prop-map-height" class="prop-input" value="700" min="500" max="1400"></div>
            </div>
            <div class="inspector-section">
              <div class="inspector-title">STARTING INVENTORY</div>
              <div class="inv-config-grid" id="editor-inv-config"></div>
            </div>
            <div id="inspector-dynamic-props"></div>
          </aside>
        </div>
      </div>
    </section>

    <div id="modal-root" class="modal-root"></div>
  </div>

  <!-- Topological Script Pipeline with Fallback Resolvers -->
  <script src="js/data/rules/constants.js"></script>
  <script src="js/data/rules/elements.js"></script>
  <script src="js/data/levels/level-registry.js"></script>
  <script src="js/data/levels/level-01.js"></script>
  <script src="js/data/levels/level-02.js"></script>
  <script src="js/data/levels/level-03.js"></script>
  <script src="js/data/levels/level-04.js"></script>
  <script src="js/data/levels/level-05.js"></script>
  <script src="js/data/levels/level-06.js"></script>
  <script src="js/data/levels/level-07.js"></script>
  <script src="js/data/levels/level-08.js"></script>
  <script src="js/data/levels/level-09.js"></script>
  <script src="js/data/levels/level-10.js"></script>

  <script src="js/systems/audio/synth.js"></script>
  <script src="js/systems/audio/sfx.js"></script>
  <script src="js/systems/physics/optics.js"></script>
  <script src="js/systems/physics/lenses.js"></script>
  <script src="js/systems/physics/geodesic.js"></script>
  <script src="js/systems/physics/raycaster.js"></script>

  <script src="js/systems/render/renderer.js"></script>
  <script src="js/systems/render/beams.js"></script>
  <script src="js/systems/render/scene.js" onerror="this.onerror=null;this.src='js/systems/render/optics-view.js'"></script>

  <script src="js/ui/controls/pointer.js"></script>
  <script src="js/ui/controls/touch.js"></script>
  <script src="js/ui/hud/header.js"></script>
  <script src="js/ui/hud/toolbar.js"></script>
  <script src="js/ui/modals/modal-manager.js"></script>
  <script src="js/ui/modals/dialogs.js"></script>

  <script src="js/editor/io.js" onerror="this.onerror=null;this.src='js/editor/editor-io.js'"></script>
  <script src="js/editor/ui.js" onerror="this.onerror=null;this.src='js/editor/editor-ui.js'"></script>
  <script src="js/editor/transform.js"></script>
  <script src="js/editor/editor.js"></script>

  <script src="js/game.js"></script>
</body>
</html>
